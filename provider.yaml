apiVersion: tinx.io/v1
kind: Provider
metadata:
  namespace: sourceplane
  name: torkflow
  version: v0.0.0
  description: Portable workflow orchestration runtime packaged as a tinx provider.
  homepage: https://github.com/sourceplane/torkflow
  license: Apache-2.0
spec:
  runtime: binary
  entrypoint: torkflow
  platforms:
    - os: darwin
      arch: arm64
      binary: bin/darwin/arm64/torkflow
    - os: darwin
      arch: amd64
      binary: bin/darwin/amd64/torkflow
    - os: linux
      arch: amd64
      binary: bin/linux/amd64/torkflow
    - os: linux
      arch: arm64
      binary: bin/linux/arm64/torkflow
  capabilities:
    run:
      description: Execute a workflow and persist run artifacts.
    view:
      description: Render workflow metadata and DAG state.
  layers:
    assets:
      root: assets