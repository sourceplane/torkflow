name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race ./...

  tinx-provider-smoke:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke test packaged tinx provider
        uses: sourceplane/tinx-action@v2
        with:
          run: |
            bash ./scripts/smoke-tinx-provider.sh
          artifacts: |
            .tinx-artifacts/status.txt
            .tinx-artifacts/view.txt
            .tinx-artifacts/run.txt
            .tinx-artifacts/runs/demo-workflow/tinx-smoke-test/state.json
            .tinx-artifacts/runs/demo-workflow/tinx-smoke-test/context.json
            .tinx-artifacts/runs/demo-workflow/tinx-smoke-test/steps/Build_Message.json
            .tinx-artifacts/runs/demo-workflow/tinx-smoke-test/steps/Send_Message.json
          artifact-name: tinx-provider-smoke