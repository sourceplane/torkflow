name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Smoke test tinx provider
        uses: sourceplane/tinx-action@v2
        with:
          run: |
            bash ./scripts/smoke-tinx-provider.sh

      - name: Stamp provider version
        run: |
          sed -i 's/^  version: .*/  version: ${{ github.ref_name }}/' provider.yaml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI artifact via tinx release action
        uses: sourceplane/tinx-release-action@v1
        with:
          manifest: provider.yaml
          main: ./cmd/torkflow
          output: oci
          dist: dist
          tag: ${{ github.ref_name }}
          push: ${{ env.IMAGE_REF }}
